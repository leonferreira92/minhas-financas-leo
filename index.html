
<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Minhas Finanças Pro</title>
    <meta name="description" content="Aplicativo mobile-first de controle financeiro pessoal com dashboard, gestão de fluxo de caixa e insights via IA." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#0F388A',
                50: '#E8EEF8',
                100: '#D1DDF1',
                200: '#A3BBE3',
                300: '#7599D5',
                400: '#4777C7',
                500: '#0F388A',
                600: '#0D2F74',
                700: '#0A255D',
                800: '#081C47',
                900: '#051230',
                950: '#030B1F',
              },
              cta: {
                DEFAULT: '#FACC15',
                soft: '#FEF9C3',
                ink: '#0F388A',
              },
              income: '#10B981',
              expense: '#EF4444',
            },
            animation: {
              'pulse-soft': 'pulseSoft 3s infinite',
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
              'fade-in': 'fadeIn 0.3s ease-out'
            },
            keyframes: {
              pulseSoft: {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: 0.85, transform: 'scale(1.02)' },
              },
              slideUp: {
                '0%': { transform: 'translateY(16px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              },
              fadeIn: {
                '0%': { opacity: 0 },
                '100%': { opacity: 1 },
              }
            }
          }
        }
      }
    </script>

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: contain;
        color: #0F172A;
        background-color: #F8FAFC;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      input[type="date"]::-webkit-calendar-picker-indicator {
        display: none;
        -webkit-appearance: none;
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 10px;
      }

      /* Design System utility classes */
      .ds-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 1.25rem;
        box-shadow: 0 1px 2px 0 rgb(15 23 42 / 0.04);
      }
      .ds-label {
        color: #475569;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .ds-title {
        color: #0F172A;
        font-weight: 900;
      }
